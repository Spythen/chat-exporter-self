<div class="chatlog__attachment">
    {{TEXT_PREVIEW}}
    <div class="chatlog__attachment-container">
        <div style="display: flex; align-items: center; gap: 10px; overflow: hidden; min-width: 0;">
            <div style="width: 32px; height: 32px; background-color: var(--bg-primary, #1e1f22); border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-muted, #949ba4);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
            </div>
            <div style="display: flex; flex-direction: column; overflow: hidden; min-width: 0;">
                <div class="chatlog__attachment-filename" style="margin: 0; line-height: 1.3;">
                    <a href="{{ATTACH_URL}}" target="_blank" rel="noreferrer">{{ATTACH_FILE}}</a>
                </div>
                <div class="chatlog__attachment-filesize" style="margin: 0; line-height: 1.2;">
                    {{ATTACH_BYTES}}
                </div>
            </div>
        </div>
        <div class="chatlog__attachment-actions" style="display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: auto; padding-left: 8px;">
            <a href="{{ATTACH_URL}}" download="{{ATTACH_FILE}}" title="Download" class="chatlog__attachment-action-btn" style="color: var(--text-normal); opacity: 0.6; transition: opacity 0.2s;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </a>
        </div>
    </div>
</div>
